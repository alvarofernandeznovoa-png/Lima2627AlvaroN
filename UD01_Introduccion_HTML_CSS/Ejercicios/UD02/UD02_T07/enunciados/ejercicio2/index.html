
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de fotografías</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <main class="galeria">

        <h1>Descubre nuevos lugares</h1>
        <p class="descripcion">
            Una selección de destinos para tu próximo viaje.
        </p>

        <div class="tarjetas">

            <article class="tarjeta">
                <img src="https://picsum.photos/id/1018/600/400"
                     alt="Montañas y lago">

                <div class="acciones">
                    <button class="favorito" aria-label="Añadir a favoritos">♥</button>
                    <button class="guardar" aria-label="Guardar fotografía">▣</button>
                </div>

                <div class="informacion">
                    <h2>Montañas y lagos</h2>
                    <p>Un paisaje para desconectar.</p>
                </div>
            </article>

            <article class="tarjeta">
                <img src="https://picsum.photos/id/1011/600/400"
                     alt="Paisaje natural">

                <div class="acciones">
                    <button class="favorito" aria-label="Añadir a favoritos">♥</button>
                    <button class="guardar" aria-label="Guardar fotografía">▣</button>
                </div>

                <div class="informacion">
                    <h2>Naturaleza salvaje</h2>
                    <p>Explora lugares sorprendentes.</p>
                </div>
            </article>

            <article class="tarjeta">
                <img src="https://picsum.photos/id/1015/600/400"
                     alt="Río entre montañas">

                <div class="acciones">
                    <button class="favorito" aria-label="Añadir a favoritos">♥</button>
                    <button class="guardar" aria-label="Guardar fotografía">▣</button>
                </div>

                <div class="informacion">
                    <h2>Rutas de montaña</h2>
                    <p>El destino perfecto para aventurarse.</p>
                </div>
            </article>

        </div>

    </main>

</body>
</html>
