<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto destacado</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <main class="escaparate">

        <article class="producto">

            <img
                src="auriculares.jpg"
                alt="Auriculares inalámbricos">

            <div class="informacion">
                <p class="categoria">AUDIO · WIRELESS</p>

                <h1>Auriculares Studio Pro</h1>

                <p class="descripcion">
                    Sonido envolvente, cancelación de ruido
                    y hasta 40 horas de autonomía.
                </p>

                <div class="precio">
                    <strong>129,90 €</strong>
                    <span>159,90 €</span>
                </div>

                <a href="#" class="comprar">Ver producto</a>
            </div>

            <div class="acciones">
                <button title="Añadir a favoritos">♥</button>
                <button title="Guardar producto">▣</button>
            </div>

        </article>

    </main>

</body>
</html>
