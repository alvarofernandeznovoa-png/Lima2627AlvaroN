    <ol>
        <li>Café</li>
        <li>Auga</li>
        <li>Leite</li>
    </ol>
    <h1>Lista mixta</h1>
    <ul>
        <li>Café</li>
        <ol>
            <li>Só</li>
            <li>Con leite</li>
            <ol>
                <li>Latte</li>
                <li>Capuccino</li>
            </ol>
        </ol>

        <li>Leite</li>
    </ul>

    <dl>
        <dt>Coche</dt>
        <dd>Vehiculo de catro rodas</dd>
        <dt>Moto</dt>
        <dd>Vehiculo de dúas rodas</dd>
    </dl>
